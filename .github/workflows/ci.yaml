name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run flake8
        run: flake8
      - name: Run tests
        run: |
          pip install pytest
          pytest -q
